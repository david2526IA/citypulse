<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CityPulse</title><style>body{max-width:780px;margin:auto;padding:48px 20px;background:#071827;color:#e5f2ff;font-family:system-ui}section{background:#0d2639;border:1px solid #254966;border-radius:14px;padding:22px;margin-top:22px}button,select{padding:10px;border-radius:8px;font:inherit}button{background:#54b6ed;border:0;font-weight:700}pre{white-space:pre-wrap;color:#c2d8e9}.muted{color:#a7c3d8}</style></head><body><h1>CityPulse</h1><p class="muted">Weather and air-quality snapshots from public data sources.</p><section><select id="city"><option>madrid</option><option>barcelona</option><option>bilbao</option><option>seville</option><option>valencia</option></select><button onclick="load()">Check conditions</button><pre id="output">Choose a city.</pre></section><script>async function load(){const city=document.getElementById('city').value;const r=await fetch('/v1/snapshot/'+city);document.getElementById('output').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
